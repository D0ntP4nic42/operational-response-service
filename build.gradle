plugins {
	id 'java'
	alias(libs.plugins.springboot)
	alias(libs.plugins.spring.dependency.management)
	alias(libs.plugins.plugin.spotless)
	id "com.google.protobuf" version "0.9.4"
}

group = 'br.petroedge'
version = '0.0.1'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation(libs.springboot.web)
	implementation(libs.springboot.webclient)
	implementation(libs.springboot.restclient)
	implementation(libs.springboot.actuator)
	implementation(libs.springboot.security)
	implementation(libs.springboot.oauth2)
	implementation(libs.springboot.jpa)
	implementation(libs.springboot.mail)
	implementation(libs.liquibase.core)

	implementation(libs.mysql.connector)
	implementation(libs.slf4j)
	implementation(libs.springdoc.openapi)

	compileOnly(libs.lombok)
	annotationProcessor(libs.lombok)

	testImplementation(libs.springboot.test)
	testImplementation(libs.swagger.parser)

	implementation("com.google.protobuf:protobuf-java:4.36.2")
	implementation("org.springframework.boot:spring-boot-starter-grpc-server:4.1.1")
}

protobuf {
	protoc {
		artifact = 'com.google.protobuf:protoc:4.36.2'
	}
	plugins {
		grpc {
			artifact = 'io.grpc:protoc-gen-grpc-java:1.84.0'
		}
	}

	generateProtoTasks {
		all().each { task ->
			task.plugins {
				grpc {}
			}
		}
	}
}

sourceSets{
	main {
		java {
			srcDirs 'src/main/java', 'build/generated/source/proto/main/java', 'build/generated/source/proto/main/grpc'
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

spotless {
	java {
		target '**/*.java'
		palantirJavaFormat('2.71.0')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
		targetExclude('**/build/**', '**/target/**')
	}
	groovyGradle {
		target '**/*.gradle'
		greclipse()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

tasks.named('check') {
	dependsOn spotlessCheck
}
