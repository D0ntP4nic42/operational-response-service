spring:
  application:
    name: operational-response-service
  profiles:
    active: api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/oprs}
    username: ${DB_USERNAME:oprs}
    password: ${DB_PASSWORD:oprs_pass}

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog.xml