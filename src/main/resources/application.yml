server:
  servlet:
    context-path: /api/oprs

spring:
  application:
    name: operational-response-service

  datasource:
    url: jdbc:mysql://localhost:3306/oprs
    username: oprs
    password: oprs_pass
  
  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog.xml
