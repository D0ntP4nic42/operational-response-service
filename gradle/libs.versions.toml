[versions]
lombok = '1.18.38'
mySQLConnector = '9.4.0'
slf4j = '2.0.17'
spotlessPlugin = '8.8.0'
springBoot = '4.1.1'
springDependencyManagementPlugin = '1.1.7'
springdoc = '3.0.3'
swaggerParser = '2.1.32'



[libraries]
liquibase-core = { module = "org.springframework.boot:spring-boot-starter-liquibase", version.ref = "springBoot" }
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
mysql-connector = { group = "com.mysql", name = "mysql-connector-j", version.ref = "mySQLConnector" }
slf4j = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
springboot-actuator = { group = "org.springframework.boot", name = "spring-boot-starter-actuator", version.ref = "springBoot" }
springboot-jpa = { group = "org.springframework.boot", name = "spring-boot-starter-data-jpa", version.ref = "springBoot" }
springboot-test = { group = "org.springframework.boot", name = "spring-boot-starter-test", version.ref = "springBoot" }
springboot-web = { module = "org.springframework.boot:spring-boot-starter-webmvc", version.ref = "springBoot" }
springboot-webclient = { module = "org.springframework.boot:spring-boot-starter-webclient", version.ref = "springBoot" }
springboot-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient", version.ref = "springBoot" }
springboot-security = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "springBoot" }
springboot-oauth2 = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server", version.ref = "springBoot" }
springdoc-openapi = { group = "org.springdoc", name = "springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
swagger-parser = { group = "io.swagger.parser.v3", name = "swagger-parser", version.ref = "swaggerParser" }
springboot-mail = { module = "org.springframework.boot:spring-boot-starter-mail", version.ref = "springBoot" }


[plugins]
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagementPlugin" }
springboot = { id = "org.springframework.boot", version.ref = "springBoot" }
plugin-spotless = { id = "com.diffplug.spotless", version.ref = "spotlessPlugin" }
